<!doctype html>
<html lang="en" data-theme="midnight">
	<head>
		<meta charset="UTF-8" />
		<script>
			// Restore the saved theme before first paint, so there is no flash of the default.
			// src/services/theme.js owns the format; invalid values fall back to Midnight.
			(function () {
				try {
					var saved = JSON.parse(localStorage.getItem('pocketgames:theme'));
					var ids = ['midnight', 'neon-arcade', 'cyberpunk', 'emerald', 'sunset', 'light', 'monochrome', 'custom'];
					if (!saved || ids.indexOf(saved.id) < 0) return;
					var root = document.documentElement;
					root.setAttribute('data-theme', saved.id);
					// the splash screen paints before the stylesheet loads, so give it this theme's colours
					var splash = { 'neon-arcade': ['#07060f', '#22d3ee'], cyberpunk: ['#0a0710', '#ff2bd6'], emerald: ['#06120d', '#10b981'], sunset: ['#140b14', '#fb923c'], light: ['#f3f5fb', '#2f5fd0'], monochrome: ['#0e0e10', '#e4e4e7'] }[saved.id];
					if (saved.id === 'custom' && saved.vars) splash = [saved.vars['--color-background'], saved.vars['--color-primary']];
					if (splash && /^#[0-9a-f]{3,8}$/i.test(splash[0]) && /^#[0-9a-f]{3,8}$/i.test(splash[1])) {
						root.style.setProperty('--splash-bg', splash[0]);
						root.style.setProperty('--splash-accent', splash[1]);
						if (saved.id === 'light' || (saved.vars && saved.vars['--scheme'] === 'light')) root.style.setProperty('--splash-text', '#0f172a');
					}
					if (saved.id === 'custom' && saved.vars) {
						for (var name in saved.vars) {
							var value = String(saved.vars[name]);
							if (/^--(color-[a-z0-9-]+|scheme)$/.test(name) && /^[#a-z0-9(),.%\s-]+$/i.test(value)) root.style.setProperty(name, value);
						}
					}
				} catch (e) {}
			})();
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>PocketGames · Play Instantly. No Downloads.</title>
		<meta name="description" content="Free browser games for everyone. Play classic arcade, puzzle, strategy, card, racing, car, ball, and sports games directly in your browser. No installation, no account, just click and play." />
		<meta name="theme-color" content="#0b1020" />
		<meta name="color-scheme" content="dark" />
		<link rel="manifest" href="./manifest.webmanifest" />
		<link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="./icons/icon-192.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="PocketGames" />
		<style>
			/* the splash screen: shown from the first paint until the app is ready (src/main.js) */
			#splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: var(--splash-bg, #0b1020); color: var(--splash-text, #f4f6ff); font-family: system-ui, 'Segoe UI', sans-serif; transition: opacity 0.45s ease, visibility 0.45s; }
			#splash.out { opacity: 0; visibility: hidden; }
			#splash .splash-box { display: grid; justify-items: center; gap: 14px; transition: transform 0.45s ease; }
			#splash.out .splash-box { transform: scale(1.06); }
			#splash .splash-logo { position: relative; width: 84px; height: 84px; }
			#splash .splash-logo img { width: 100%; height: 100%; border-radius: 22px; animation: splash-bob 1.6s ease-in-out infinite; }
			#splash .splash-logo::after { content: ''; position: absolute; inset: -10px; border-radius: 30px; border: 3px solid var(--splash-accent, #4f8cff); opacity: 0.6; animation: splash-ring 1.6s ease-out infinite; }
			#splash .splash-name { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.02em; }
			#splash .splash-name b { color: var(--splash-accent, #4f8cff); }
			#splash .splash-bar { width: 160px; height: 6px; border-radius: 99px; overflow: hidden; background: rgba(127, 127, 127, 0.25); position: relative; }
			#splash .splash-bar i { position: absolute; top: 0; bottom: 0; left: -40%; width: 40%; border-radius: inherit; background: var(--splash-accent, #4f8cff); animation: splash-run 1.05s ease-in-out infinite; }
			#splash .splash-dots { display: flex; gap: 8px; }
			#splash .splash-dots span { width: 9px; height: 9px; border-radius: 3px; background: var(--splash-accent, #4f8cff); animation: splash-dot 0.9s ease-in-out infinite; }
			#splash .splash-dots span:nth-child(2) { animation-delay: 0.15s; opacity: 0.8; }
			#splash .splash-dots span:nth-child(3) { animation-delay: 0.3s; opacity: 0.6; }
			@keyframes splash-bob { 50% { transform: translateY(-6px) rotate(-3deg); } }
			@keyframes splash-ring { from { transform: scale(0.85); opacity: 0.7; } to { transform: scale(1.25); opacity: 0; } }
			@keyframes splash-run { to { left: 100%; } }
			@keyframes splash-dot { 50% { transform: translateY(-7px); } }
			@media (prefers-reduced-motion: reduce) { #splash *, #splash *::after { animation: none !important; } }
		</style>
	</head>
	<body>
		<div id="splash" role="progressbar" aria-label="Loading PocketGames">
			<div class="splash-box">
				<div class="splash-logo"><img src="./icons/icon.svg" alt="" /></div>
				<div class="splash-name">Pocket<b>Games</b></div>
				<div class="splash-bar"><i></i></div>
				<div class="splash-dots"><span></span><span></span><span></span></div>
			</div>
		</div>
		<div id="app">
			<noscript>PocketGames needs JavaScript to run its games.</noscript>
		</div>
		<script type="module" src="./src/main.js"></script>
	</body>
</html>
