<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PocketGames · Offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1020; color: #f4f6ff; font-family: system-ui, sans-serif; text-align: center; padding: 16px; }
  .box { max-width: 420px; }
  h1 { font-size: 1.8rem; margin: 0 0 10px; }
  p { color: #aab3dd; line-height: 1.5; }
  button { margin-top: 16px; height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: linear-gradient(135deg, #4f8cff, #8b5cf6); color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <h1>You are offline</h1>
    <p>PocketGames has not finished saving itself on this device yet, so it cannot start without a connection. Connect once and open PocketGames; after that every game plays offline.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
